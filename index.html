<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Мультивселенная - Карты миров</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=MedievalSharp&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg-base: #050506; --panel-bg: rgba(15, 16, 19, 0.98); --modal-bg: rgba(10, 11, 14, 0.98);
    --iron: #2a3038; --iron-light: #4a5563; --steel: #6c7c8c; --accent: #a0b8c8;
    --accent-glow: rgba(160, 184, 200, 0.3); --blood: #6b1414; --blood-light: #a82020;
    --text: #b0bcc2; --border: #1c2026;
    --font-main: 'EB Garamond', 'Times New Roman', serif; 
    --font-title: 'Cinzel', serif; 
    --font-fantasy: 'MedievalSharp', cursive;
    --particle-color-1: rgba(160, 184, 200, 0.6); --particle-color-2: rgba(168, 32, 32, 0.5); --particle-color-3: rgba(255, 255, 255, 0.4);
    --bg-radial-1: rgba(40, 25, 45, 0.4); --bg-radial-2: rgba(25, 30, 40, 0.5);
  }

  body.theme-north {
    --bg-base: #060b14; --panel-bg: rgba(10, 18, 30, 0.95); --iron: #1c2a3a; --iron-light: #2e4a66;
    --steel: #4a7a9a; --accent: #a0d4f0; --accent-glow: rgba(160, 212, 240, 0.4);
    --blood: #1e4d6b; --blood-light: #3a88b8; --text: #d0e0f0; --border: #14202e;
    --particle-color-1: rgba(200, 230, 255, 0.8); --particle-color-2: rgba(255, 255, 255, 0.5); --particle-color-3: rgba(100, 150, 200, 0.4);
    --bg-radial-1: rgba(20, 40, 70, 0.6); --bg-radial-2: rgba(10, 20, 35, 0.8);
  }

  body.theme-desert {
    --bg-base: #140f0a; --panel-bg: rgba(25, 18, 12, 0.95); --iron: #3a2a1a; --iron-light: #6a4a2a;
    --steel: #9a6a3a; --accent: #e6b860; --accent-glow: rgba(230, 184, 96, 0.4);
    --blood: #7a2a1a; --blood-light: #b8442a; --text: #e0c8a8; --border: #2a1e14;
    --particle-color-1: rgba(230, 200, 120, 0.6); --particle-color-2: rgba(180, 120, 50, 0.5); --particle-color-3: rgba(100, 80, 60, 0.6);
    --bg-radial-1: rgba(60, 40, 20, 0.6); --bg-radial-2: rgba(30, 20, 10, 0.8);
  }

  body { 
    font-family: var(--font-main); color: var(--text); height: 100vh; height: 100dvh;
    overflow: hidden; overscroll-behavior: none; background-color: var(--bg-base);
    position: relative; transition: background-color 0.8s ease;
  }

  body::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, var(--bg-radial-1) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, var(--bg-radial-2) 0%, transparent 50%);
    animation: pulseBg 10s ease-in-out infinite alternate; z-index: -2; pointer-events: none; transition: background 0.8s ease;
  }

  @keyframes pulseBg { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

  .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    20% { opacity: 1; } 80% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  #worldsScreen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; padding: 40px; overflow-y: auto;
  }

  .worlds-title {
    font-family: var(--font-title); font-size: 3rem; color: #fff;
    text-shadow: 0 0 20px var(--accent-glow), 0 4px 10px rgba(0,0,0,0.9);
    margin-bottom: 3rem; text-align: center; letter-spacing: 2px;
  }

  .worlds-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem; width: 100%; max-width: 1200px; margin-bottom: 3rem;
  }

  .world-card {
    background: var(--panel-bg); border: 1px solid var(--iron-light);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    display: flex; flex-direction: column; position: relative;
    height: 380px;
  }
  .world-card:hover {
    transform: translateY(-10px); border-color: var(--accent);
    box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
  }

  .world-card-img {
    height: 180px; background-size: cover; background-position: center;
    border-bottom: 1px solid var(--iron-light); position: relative; flex-shrink: 0;
  }
  .world-card-img::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, transparent 50%, var(--panel-bg) 100%);
  }

  .world-card-content { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .world-card-title { font-family: var(--font-title); font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; }
  .world-card-desc { font-size: 1rem; color: var(--text); opacity: 0.8; flex: 1; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
  .world-card-stats { font-size: 0.85rem; color: var(--accent); display: flex; gap: 15px; flex-shrink: 0; }

  .world-card-delete {
    position: absolute; top: 10px; right: 10px; background: rgba(107, 20, 20, 0.8);
    border: 1px solid var(--blood); color: #fff; width: 30px; height: 30px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transition: opacity 0.2s; z-index: 10;
  }
  .world-card:hover .world-card-delete { opacity: 1; }
  .world-card-delete:hover { background: var(--blood-light); }

  .add-world-btn {
    background: linear-gradient(180deg, var(--iron-light), var(--iron));
    border: 2px dashed var(--accent); color: var(--accent);
    padding: 1.5rem 3rem; border-radius: 12px; font-family: var(--font-title);
    font-size: 1.2rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    letter-spacing: 2px; display: flex; align-items: center; gap: 15px;
  }
  .add-world-btn:hover { background: var(--iron); color: #fff; box-shadow: 0 0 20px var(--accent-glow); }

  #mapInterface { display: none; height: 100%; width: 100%; position: relative; }
  
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 60px; background: var(--panel-bg);
    border-bottom: 1px solid var(--iron-light); display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  }
  .current-world-name { font-family: var(--font-title); font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 10px; }
  .back-to-worlds-btn {
    background: transparent; border: 1px solid var(--iron-light); color: var(--text);
    padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: var(--font-title);
    transition: all 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .back-to-worlds-btn:hover { background: var(--iron); color: #fff; border-color: var(--accent); }

  .map-viewport { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow: hidden; background: transparent; cursor: grab; touch-action: none; z-index: 1; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
  .map-viewport.grabbing { cursor: grabbing; } .map-viewport.master-mode { cursor: crosshair; }
  .map-viewport.shifted { transform: translateX(-30%); }
  
  .map-world { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s ease-out; transform-origin: 0 0; display: flex; align-items: center; justify-content: center; }
  .map-world.dragging { transition: none; }
  
  #mapWrapper { position: absolute; display: block; pointer-events: none; }
  #mapBg { display: block; width: 100%; height: 100%; object-fit: fill; user-select: none; opacity: 0; transition: opacity 0.5s; filter: brightness(0.8) contrast(1.2); pointer-events: none; }
  #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  #drawCanvas.active { pointer-events: auto; cursor: crosshair; }

  /* Иконка города */
  .city-pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; pointer-events: auto; }
  .pin-icon { font-size: 1.5rem; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle, rgba(42, 48, 56, 0.8) 0%, transparent 70%); box-shadow: 0 0 10px rgba(0,0,0,0.8); filter: drop-shadow(0 0 5px var(--accent-glow)); }
  .pin-icon img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--iron-light); }
  .pin-label { background: rgba(20, 24, 28, 0.95); color: var(--accent); padding: 3px 10px; font-family: var(--font-title); font-size: 0.8rem; border: 1px solid var(--iron-light); white-space: nowrap; margin-top: 4px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1); letter-spacing: 1px; }

  .quick-delete-city { position: absolute; top: -10px; right: -10px; background: var(--blood); color: #fff; border: 1px solid var(--iron-light); border-radius: 50%; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 30; font-family: var(--font-title); }
  .city-pin:hover .quick-delete-city { display: flex; }
  .quick-delete-city:hover { background: var(--blood-light); box-shadow: 0 0 15px var(--blood); }

  .city-panel { position: absolute; top: 60px; right: 0; width: 400px; height: calc(100% - 60px); background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-left: 2px solid rgba(74, 85, 99, 0.8); transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; z-index: 999; box-shadow: -15px 0 40px rgba(0,0,0,0.9); }
  .city-panel.open { transform: translateX(0); }
  .panel-header { padding: 2.5rem 1.5rem 1.5rem; border-bottom: 1px solid rgba(74, 85, 99, 0.3); position: relative; }
  .close-btn { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 1000; background: var(--iron); border: 2px solid var(--iron-light); color: var(--accent); font-size: 1.2rem; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
  .close-btn:hover { color: #fff; background: var(--blood); border-color: var(--blood-light); box-shadow: 0 0 15px rgba(168, 32, 32, 0.8); }
  .panel-title { font-family: var(--font-title); font-weight: 900; font-size: 1.8rem; color: #fff; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); padding-right: 40px; display: flex; align-items: center; gap: 15px; }
  .panel-title .title-icon img { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; border: 2px solid var(--iron-light); }
  .panel-desc { color: var(--text); font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.5rem; font-style: italic; opacity: 0.8; }
  .panel-actions { display: flex; gap: 12px; position: relative; z-index: 1000; }
  .edit-btn, .delete-city-btn { background: linear-gradient(180deg, var(--iron-light), var(--iron)); border: 1px solid var(--iron-light); color: var(--accent); padding: 0.6rem 1rem; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; flex: 1; font-family: var(--font-title); letter-spacing: 1px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
  .edit-btn:hover { border-color: var(--accent); color: #fff; }
  .delete-city-btn { border-color: var(--blood); color: var(--blood-light); }
  .delete-city-btn:hover { background: var(--blood); color: #fff; border-color: var(--blood-light); }

  .npc-list { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .npc-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 1rem; display: flex; gap: 1rem; position: relative; transition: all 0.2s; border-radius: 6px; cursor: pointer; }
  .npc-card:hover { border-color: var(--steel); background: rgba(20, 24, 28, 0.6); transform: translateX(-3px); }
  .npc-avatar { width: 60px; height: 60px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; border: 2px solid var(--iron); overflow: hidden; border-radius: 50%; }
  .npc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .npc-info h3 { color: #d1dae2; font-size: 1.3rem; margin-bottom: 0.2rem; font-family: var(--font-title); }
  .npc-info p { font-size: 1rem; color: var(--text); line-height: 1.4; opacity: 0.8; }
  .delete-npc { position: absolute; top: 10px; right: 10px; background: transparent; border: 1px solid var(--blood); color: var(--blood-light); cursor: pointer; padding: 2px 8px; font-size: 0.75rem; border-radius: 3px; font-family: var(--font-title); transition: all 0.2s; }
  .delete-npc:hover { background: var(--blood); color: #fff; }

  .controls { position: absolute; left: 20px; top: 80px; display: flex; flex-direction: column; gap: 10px; z-index: 30; width: 220px; }
  .mobile-menu-btn { display: none; background: rgba(20, 24, 28, 0.9); border: 1px solid var(--iron-light); color: var(--accent); font-size: 1.5rem; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 40; }
  .desktop-menu { display: flex; flex-direction: column; gap: 10px; }
  
  .menu-group { background: var(--panel-bg); border: 1px solid var(--iron-light); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
  .menu-group-header { padding: 0.8rem 1rem; font-family: var(--font-title); font-weight: 700; font-size: 0.95rem; color: var(--accent); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; background: linear-gradient(180deg, var(--iron-light) 0%, var(--iron) 100%); user-select: none; }
  .menu-group-header:hover { background: linear-gradient(180deg, var(--iron) 0%, var(--bg-base) 100%); color: #fff; }
  .menu-group-header .arrow { font-size: 0.7rem; transition: transform 0.3s; }
  .menu-group.open .menu-group-header { border-bottom: 1px solid var(--border); }
  .menu-group.open .menu-group-header .arrow { transform: rotate(180deg); }
  .menu-group-content { display: none; flex-direction: column; padding: 8px; gap: 8px; background: var(--panel-bg); }
  .menu-group.open .menu-group-content { display: flex; }

  .btn { background: linear-gradient(180deg, var(--iron-light) 0%, var(--iron) 50%, var(--bg-base) 100%); border: 1px solid var(--iron-light); color: var(--accent); padding: 0.6rem 0.8rem; cursor: pointer; font-family: var(--font-title); font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; transition: all 0.2s; display: flex; align-items: center; justify-content: flex-start; gap: 10px; width: 100%; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
  .btn:hover { background: linear-gradient(180deg, var(--iron) 0%, var(--bg-base) 100%); color: #fff; border-color: var(--accent); } 
  .btn.active { background: linear-gradient(180deg, var(--blood-light) 0%, var(--blood) 100%); color: #fff; border-color: var(--blood-light); box-shadow: 0 0 15px rgba(168, 32, 32, 0.4); }
  .btn-icon { font-size: 1.1rem; }
  #bgInput { display: none; }

  .draw-controls { display: none; flex-direction: column; gap: 12px; background: var(--bg-base); padding: 15px; border: 1px solid var(--iron-light); width: 100%; border-radius: 6px; margin-top: 5px; }
  .draw-controls.active { display: flex; }
  .color-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .color-opt { width: 100%; aspect-ratio: 1; cursor: pointer; border: 1px solid #000; transition: transform 0.1s; border-radius: 50%; }
  .color-opt:hover { transform: scale(1.1); border-color: #fff; }
  .color-opt.selected { border: 2px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
  .brush-size-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
  .size-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .brush-num-input { width: 45px; background: #050505; border: 1px solid var(--iron); color: var(--accent); padding: 4px; text-align: center; font-family: var(--font-title); font-size: 0.9rem; outline: none; border-radius: 4px; }
  .draw-actions { display: flex; gap: 10px; margin-top: 5px; }
  .draw-actions .btn { min-width: 0; flex: 1; padding: 0.5rem 0; font-size: 1rem; justify-content: center; }

  /* МОДАЛКИ */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--modal-bg); padding: 2rem 1.5rem; border: 1px solid var(--iron-light); width: 600px; max-width: 100%; max-height: 95vh; overflow-y: auto; position: relative; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
  .modal h2 { color: #fff; margin-bottom: 1.5rem; font-family: var(--font-title); font-size: 1.6rem; text-align: center; letter-spacing: 1px; }
  .form-group { margin-bottom: 1rem; } 
  .form-group label { display: block; font-size: 0.9rem; color: var(--accent); margin-bottom: 0.4rem; font-family: var(--font-title); }
  .modal input[type="text"], .modal textarea, .modal select { width: 100%; background: #050505; border: 1px solid var(--iron); color: var(--text); padding: 0.8rem; font-family: var(--font-main); font-size: 1.1rem; outline: none; border-radius: 4px; }
  .modal input[type="text"]:focus, .modal textarea:focus, .modal select:focus { border-color: var(--iron-light); } 
  .modal textarea { resize: vertical; height: 120px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; } 
  .modal-actions .btn { padding: 0.7rem 1rem; flex: 1; justify-content: center; }
  #saveModal { background: linear-gradient(180deg, var(--blood-light) 0%, var(--blood) 50%, #3a0a0a 100%); color: #fff; border-color: var(--blood-light); }

  .icon-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; background: #050505; border: 1px solid var(--iron); padding: 10px; max-height: 120px; overflow-y: auto; margin-bottom: 10px; border-radius: 4px; }
  .icon-option { font-size: 1.2rem; background: #111316; border: 1px solid #000; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 35px; transition: all 0.15s; border-radius: 4px; }
  .icon-option:hover { background: var(--iron); } 
  .icon-option.selected { border-color: #fff; background: var(--iron-light); }
  
  .upload-row { display: flex; gap: 10px; align-items: center; }
  .upload-label { flex: 1; padding: 0.6rem; background: #111316; border: 1px dashed var(--iron-light); text-align: center; cursor: pointer; color: var(--accent); font-size: 0.9rem; font-family: var(--font-title); transition: all 0.2s; border-radius: 4px; }
  .upload-label:hover { background: var(--iron); border-color: #fff; color: #fff; }
  .upload-preview { width: 100%; height: 120px; border: 2px solid var(--iron-light); object-fit: cover; display: none; border-radius: 4px; margin-top: 10px; }

  .edit-npc-list { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .edit-npc-item { display: flex; justify-content: space-between; align-items: center; background: #050505; padding: 0.5rem; margin-bottom: 0.5rem; border: 1px solid var(--iron); border-left: 3px solid var(--blood); font-size: 0.95rem; border-radius: 4px; } 
  
  #syncStatus { position: absolute; top: 80px; right: 20px; background: var(--panel-bg); color: var(--accent); padding: 8px 15px; font-size: 0.85rem; z-index: 50; border: 1px solid var(--iron-light); transition: opacity 0.5s; font-family: var(--font-title); border-radius: 4px; backdrop-filter: blur(5px); }
  #saveBgBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; z-index: 40; background: linear-gradient(180deg, var(--blood-light) 0%, var(--blood) 100%); color: #fff; border-color: var(--blood-light); min-width: auto; border-radius: 50px; padding: 0.8rem 2rem; font-size: 0.95rem; box-shadow: 0 5px 20px rgba(0,0,0,0.6); }

  #searchModal .modal, #allNpcModal .modal, #allItemsModal .modal, #createWorldModal .modal, #worldDescModal .modal { width: 850px; }
  .search-item { background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 1rem; margin-bottom: 0.8rem; cursor: pointer; transition: all 0.2s; border-radius: 6px; }
  .search-item:hover { border-color: var(--iron-light); background: rgba(20, 24, 28, 0.8); }
  .search-item .type { font-size: 0.75rem; color: var(--blood-light); text-transform: uppercase; margin-bottom: 0.3rem; display: block; font-family: var(--font-title); font-weight: bold; }
  .search-item .title { font-weight: bold; font-size: 1.2rem; color: #fff; font-family: var(--font-title); }
  .search-item .subtitle { font-size: 1rem; color: var(--text); margin-top: 5px; opacity: 0.8; }

    // Init
    async function initApp() {
      try {
        const { data, error } = await supabase.from('map_data').select('*').eq('id', 1).single();
        
        if (error) {
          console.error("Ошибка загрузки:", error);
          syncStatus.textContent = "Ошибка сети. Данные не тронуты.";
          syncStatus.style.color = "#ff5555";
          
          const localBackup = localStorage.getItem('dnd_worlds_backup');
          if (localBackup) {
            state.worlds = JSON.parse(localBackup);
            alert("Восстановлены данные из памяти браузера!");
          } else {
            state.worlds = [];
          }
          state.isLoaded = true;
          renderWorldsScreen();
          return;
        }

        if (data && data.data && data.data.worlds) {
          state.worlds = data.data.worlds;
          localStorage.setItem('dnd_worlds_backup', JSON.stringify(state.worlds));
        } else {
          state.worlds = [];
        }
        
        state.isLoaded = true;
        renderWorldsScreen();
        
        const savedWorldId = localStorage.getItem('dnd_current_world_id');
        if (savedWorldId && state.worlds.find(w => w.id == savedWorldId)) {
          enterWorld(parseInt(savedWorldId));
        }
        
        supabase.channel('map_updates')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'map_data' }, (payload) => {
            if (payload.new && payload.new.data && Array.isArray(payload.new.data.worlds)) {
              if (payload.new.data.worlds.length === 0 && state.worlds.length > 0) return;
              
              state.worlds = payload.new.data.worlds;
              localStorage.setItem('dnd_worlds_backup', JSON.stringify(state.worlds));
              
              if (!state.currentWorld) {
                renderWorldsScreen();
              } else {
                const updatedWorld = state.worlds.find(w => w.id === state.currentWorld.id);
                if (updatedWorld) {
                  state.currentWorld = updatedWorld;
                  state.cities = updatedWorld.cities || [];
                  state.items = updatedWorld.items || [];
                  if (updatedWorld.background !== state.currentBgBase64) {
                    state.currentBgBase64 = updatedWorld.background || "";
                    if (state.currentBgBase64) {
                      mapBg.src = state.currentBgBase64;
                      mapBg.style.opacity = '1';
                      onMapLoaded();
                    } else {
                      mapBg.src = "";
                      mapBg.style.opacity = '0';
                    }
                  }
                  renderPins();
                }
              }
            }
          }).subscribe();
      } catch (err) { 
        console.error("Критическая ошибка:", err); 
      }
    }

    // Map Logic
    window.onMapLoaded = function() {
      if (!mapBg.naturalWidth) return;
      const vw = viewport.clientWidth; const vh = viewport.clientHeight;
      const imgW = mapBg.naturalWidth; const imgH = mapBg.naturalHeight;
      
      // Рассчитываем размеры так, чтобы карта вписывалась в экран, но не искажалась
      const imgRatio = imgW / imgH; 
      const boxRatio = vw / vh;

      if (imgRatio > boxRatio) {
        // Карта шире экрана
        mapWrapper.style.width = '100%'; 
        mapWrapper.style.height = `${vw / imgRatio}px`; 
      } else {
        // Карта выше экрана
        mapWrapper.style.height = '100%'; 
        mapWrapper.style.width = `${vh * imgRatio}px`; 
      }
      
      // Центрируем карту внутри вьюпорта
      mapWrapper.style.position = 'absolute';
      mapWrapper.style.left = '50%';
      mapWrapper.style.top = '50%';
      mapWrapper.style.transform = 'translate(-50%, -50%)';
      
      // Сбрасываем зум
      world.style.transform = `translate(0px, 0px) scale(1)`;
      state.currentX = 0; state.currentY = 0; state.currentScale = 1;

      resizeCanvas();
      renderPins(); 
    };

    function resizeCanvas() {
      if (!mapWrapper.clientWidth) return;
      drawCanvas.width = mapWrapper.clientWidth;
      drawCanvas.height = mapWrapper.clientHeight;
    }
    window.addEventListener('resize', () => { if (mapBg.src) onMapLoaded(); });

    let history = []; let isDrawing = false; let lastX = 0, lastY = 0;

    function saveHistory() {
      if (!drawCanvas.width) return;
      if (history.length > 20) history.shift(); 
      history.push(ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
    }

    function getCanvasCoords(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      return { x: (clientX - rect.left) * (drawCanvas.width / rect.width), y: (clientY - rect.top) * (drawCanvas.height / rect.height) };
    }

    viewport.addEventListener('mousedown', (e) => {
      if (!state.isDrawMode) return;
      const { x, y } = getCanvasCoords(e.clientX, e.clientY);
      isDrawing = true; [lastX, lastY] = [x, y]; saveHistory(); 
      ctx.beginPath(); ctx.arc(x, y, state.brushSize / 2, 0, Math.PI * 2); ctx.fillStyle = state.drawColor; ctx.fill();
    });
    viewport.addEventListener('mousemove', (e) => {
      if (!state.isDrawMode || !isDrawing) return;
      const { x, y } = getCanvasCoords(e.clientX, e.clientY);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
      ctx.strokeStyle = state.drawColor; ctx.lineWidth = state.brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      [lastX, lastY] = [x, y];
    });
    viewport.addEventListener('mouseup', () => isDrawing = false);
    viewport.addEventListener('mouseleave', () => isDrawing = false);

    viewport.addEventListener('touchstart', (e) => {
      if (!state.isDrawMode) return;
      const { x, y } = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
      isDrawing = true; [lastX, lastY] = [x, y]; saveHistory(); 
      ctx.beginPath(); ctx.arc(x, y, state.brushSize / 2, 0, Math.PI * 2); ctx.fillStyle = state.drawColor; ctx.fill();
    }, { passive: true });
    viewport.addEventListener('touchmove', (e) => {
      if (!state.isDrawMode || !isDrawing) return;
      const { x, y } = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
      ctx.strokeStyle = state.drawColor; ctx.lineWidth = state.brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      [lastX, lastY] = [x, y];
    }, { passive: true });
    viewport.addEventListener('touchend', () => isDrawing = false);

    drawBtn.addEventListener('click', () => {
      state.isDrawMode = !state.isDrawMode;

    document.querySelectorAll('.color-opt').forEach(opt => {

    document.getElementById('undoBtn').addEventListener('click', () => { if (history.length > 0) { const prev = history.pop(); ctx.putImageData(prev, 0, 0); } });
    document.getElementById('clearDrawingBtn').addEventListener('click', () => { if (confirm('Очистить границы?')) { saveHistory(); ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); } });

    let isDraggingMap = false, startX = 0, startY = 0, startTx = 0, startTy = 0, hasMoved = false;
    let pinchStartDist = 0, pinchStartScale = 1, pinchCenterX = 0, pinchCenterY = 0;

    function startDrag(clientX, clientY) {
      if (state.isDrawMode) return; 
      isDraggingMap = true; hasMoved = false;
      startX = clientX; startY = clientY; startTx = state.currentX; startTy = state.currentY;
      world.classList.add('dragging'); viewport.classList.add('grabbing');
    }
    function moveDrag(clientX, clientY) {
      if (!isDraggingMap) return;
      const dx = clientX - startX; const dy = clientY - startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) hasMoved = true; 
      state.currentX = startTx + dx; state.currentY = startTy + dy;
      world.style.transform = `translate(${state.currentX}px, ${state.currentY}px) scale(${state.currentScale})`;
    }
    function endDrag() {
      if (!isDraggingMap) return;
      isDraggingMap = false; world.classList.remove('dragging'); viewport.classList.remove('grabbing');
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.city-pin') || e.target.closest('.city-panel') || e.target.closest('.controls')) return;
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    viewport.addEventListener('touchstart', (e) => {
      if (e.target.closest('.city-pin') || e.target.closest('.city-panel') || e.target.closest('.controls')) return;
      if (e.touches.length === 1 && !state.isDrawMode) {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2) {
        isDraggingMap = false;
        pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        pinchStartScale = state.currentScale;
        pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        world.classList.add('dragging');
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => { 
      if (e.touches.length === 1 && !state.isDrawMode) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY); 
      } else if (e.touches.length === 2 && !state.isDrawMode) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const newScale = Math.max(0.5, Math.min(6, pinchStartScale * (dist / pinchStartDist)));
        const rect = viewport.getBoundingClientRect();
        const mouseX = pinchCenterX - rect.left; const mouseY = pinchCenterY - rect.top;
        const worldX = (mouseX - state.currentX) / state.currentScale; const worldY = (mouseY - state.currentY) / state.currentScale;
        state.currentX = mouseX - worldX * newScale; state.currentY = mouseY - worldY * newScale; state.currentScale = newScale;
        world.style.transform = `translate(${state.currentX}px, ${state.currentY}px) scale(${state.currentScale})`;
      }
    }, { passive: false });
    viewport.addEventListener('touchend', endDrag);

    viewport.addEventListener('wheel', (e) => {
      if (state.isDrawMode) return; 
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
      const oldScale = state.currentScale;
      let newScale = e.deltaY < 0 ? oldScale * 1.1 : oldScale / 1.1;
      newScale = Math.max(0.5, Math.min(6, newScale));
      if (newScale === oldScale) return;
      const worldX = (mouseX - state.currentX) / oldScale; const worldY = (mouseY - state.currentY) / oldScale;
      state.currentX = mouseX - worldX * newScale; state.currentY = mouseY - worldY * newScale; state.currentScale = newScale;
      world.classList.add('dragging');
      world.style.transform = `translate(${state.currentX}px, ${state.currentY}px) scale(${state.currentScale})`;
      clearTimeout(window._wheelTimeout);
      window._wheelTimeout = setTimeout(() => { world.classList.remove('dragging'); }, 150);
    }, { passive: false });

    function zoomToCity(city) {
      const vw = viewport.clientWidth; 
      const vh = viewport.clientHeight;
      const isMobile = window.innerWidth <= 768;
      const offsetX = isMobile ? 0 : 200; 
      const offsetY = 0; 
      const scale = 2.5;
      
      if (!mapWrapper.clientWidth) return;

      const cityX = mapWrapper.offsetLeft + (city.x / 100) * mapWrapper.clientWidth; 
      const cityY = mapWrapper.offsetTop + (city.y / 100) * mapWrapper.clientHeight;
      
      let tx = ((vw - offsetX) / 2) - (cityX * scale);
      let ty = ((vh - offsetY) / 2) - (cityY * scale);
      
      tx = Math.min(0, Math.max(vw - (vw * scale), tx));
      ty = Math.min(0, Math.max(vh - (vh * scale), ty));
      
      state.currentScale = scale; 
      state.currentX = tx; 
      state.currentY = ty;
      
      requestAnimationFrame(() => {
        world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      });
    }

    function resetZoom() {
      state.currentScale = 1; state.currentX = 0; state.currentY = 0;
      world.style.transform = `translate(0, 0) scale(1)`;
      cityPanel.classList.remove('open'); state.currentCity = null; state.highlightedNpcName = null;
      fullCard.classList.remove('open'); 
      viewport.classList.remove('shifted');
    }

    document.getElementById('resetZoom').addEventListener('click', resetZoom);
    document.getElementById('closePanel').addEventListener('click', resetZoom);
    closeFullCard.addEventListener('click', () => { fullCard.classList.remove('open'); viewport.classList.remove('shifted'); });

    function renderPins() {
      document.querySelectorAll('.city-pin').forEach(el => el.remove());
      state.cities.forEach(city => {
        const pin = document.createElement('div');
        pin.className = 'city-pin';
        pin.style.left = city.x + '%'; pin.style.top = city.y + '%';
        let iconHtml = city.icon.startsWith('data:image') ? `<img src="${city.icon}" alt="">` : city.icon;
        
        pin.innerHTML = `
          <div class="pin-icon">${iconHtml}</div>
          <div class="pin-label">${city.name}</div>
          <div class="quick-delete-city" title="Удалить город">✕</div>
        `;

        pin.querySelector('.quick-delete-city').addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`Удалить город "${city.name}"?`)) {
            state.cities = state.cities.filter(c => c.id !== city.id);
            renderPins();
            if (state.currentCity && state.currentCity.id === city.id) resetZoom();
            triggerSave();
          }
        });

        pin.addEventListener('click', (e) => {
          if (e.target.closest('.quick-delete-city')) return;
          e.stopPropagation();
          if (hasMoved) return;
          state.highlightedNpcName = null;
          openCityPanel(city); 
          zoomToCity(city);
          if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
        });
        mapWrapper.appendChild(pin);
      });
    }

    function openCityPanel(city, highlightName = null) {
      state.currentCity = city;
      let iconHtml = city.icon.startsWith('data:image') ? `<img src="${city.icon}" alt="">` : city.icon;
      
      cityTitle.innerHTML = `<span class="title-icon">${iconHtml}</span> ${city.name}`;
      cityDesc.textContent = city.desc || 'Нет описания.';
      npcList.innerHTML = '';
      
      if (!city.npcs || city.npcs.length === 0) {
        npcList.innerHTML = '<p style="color:#5a6e7d; text-align:center; font-style:italic;">В этом городе пока нет NPC.</p>';
      } else {
        city.npcs.forEach((npc, idx) => {
          const card = document.createElement('div'); 
          card.className = 'npc-card';
          if (highlightName && npc.name === highlightName) {
            card.classList.add('highlight');
            setTimeout(() => { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
          }
          
          let avatarHtml = '👤';
          let isImg = false;
          if (npc.avatar) {
            isImg = npc.avatar.startsWith('data:image');
            avatarHtml = isImg ? `<img src="${npc.avatar}" alt="">` : npc.avatar;
          }

          card.innerHTML = `
            <div class="npc-avatar">${avatarHtml}</div>
            <div class="npc-info"><h3>${npc.name}</h3><p>${npc.desc}</p></div>
            <button class="delete-npc" data-idx="${idx}">Убить</button>
          `;
          
          card.addEventListener('click', (e) => {
            if (e.target.closest('.delete-npc')) return; 
            openFullCard(npc.name, 'NPC', npc.desc, isImg ? npc.avatar : avatarHtml, isImg);
          });

          card.querySelector('.delete-npc').addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm(`Удалить ${npc.name}?`)) { 
              city.npcs.splice(idx, 1); 
              triggerSave(); 
              openCityPanel(city); 
            }
          });
          npcList.appendChild(card);
        });
      }
      cityPanel.classList.add('open');
    }

    function openFullCard(title, sub, desc, avatarHtml, isImage) {
      fullCardTitle.textContent = title;
      fullCardSub.textContent = sub;
      fullCardDesc.textContent = desc || 'Нет описания.';
      if (isImage) fullCardAvatar.innerHTML = `<img src="${avatarHtml}" alt="">`;
      else fullCardAvatar.innerHTML = `<span>${avatarHtml}</span>`;
      fullCard.classList.add('open');
      if (window.innerWidth > 768) viewport.classList.add('shifted');
    }

    function handlePhotoUpload(input, preview, callback) {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 1 * 1024 * 1024) { alert("Файл слишком большой! Выберите фото до 1 МБ."); return; }
        const reader = new FileReader();
        reader.onload = (ev) => { preview.src = ev.target.result; preview.style.display = 'block'; callback(ev.target.result); };
        reader.readAsDataURL(file);
      });
    }

    handlePhotoUpload(cityPhotoInput, cityPhotoPreview, (base64) => { state.tempCityPhoto = base64; });
    handlePhotoUpload(npcPhotoInput, npcPhotoPreview, (base64) => { state.tempNpcPhoto = base64; });
    handlePhotoUpload(itemPhotoInput, itemPhotoPreview, (base64) => { state.tempItemPhoto = base64; });
    handlePhotoUpload(globalNpcPhotoInput, globalNpcPhotoPreview, (base64) => { state.tempGlobalNpcPhoto = base64; });

    function renderIconPicker(picker, icons, selected, callback) {
      picker.innerHTML = '';
      icons.forEach(icon => {
        const el = document.createElement('div');
        el.className = 'icon-option' + (selected === icon ? ' selected' : '');
        el.textContent = icon;
        el.addEventListener('click', () => {
          callback(icon);
          picker.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
        });
        picker.appendChild(el);
      });
    }

    viewport.addEventListener('click', (e) => {
      if (!state.isMasterMode || state.isDrawMode) return;
      if (e.target.closest('.city-pin') || e.target.closest('.city-panel') || e.target.closest('.controls')) return;
      if (hasMoved) { hasMoved = false; return; }
      
      const rect = viewport.getBoundingClientRect();
      const clickX = e.clientX - rect.left; 
      const clickY = e.clientY - rect.top;
      
      // Получаем координаты клика относительно самой карты (а не экрана)
      const mapRect = mapWrapper.getBoundingClientRect();
      const wrapperX = e.clientX - mapRect.left; 
      const wrapperY = e.clientY - mapRect.top;
      
      const xPercent = (wrapperX / mapWrapper.clientWidth) * 100; 
      const yPercent = (wrapperY / mapWrapper.clientHeight) * 100;

      if (xPercent < 0 || xPercent > 100 || yPercent < 0 || yPercent > 100) return;

      state.tempCoord = { x: xPercent, y: yPercent };
      state.editingCityId = null; state.tempNpcs = []; state.tempCityPhoto = ""; state.tempNpcPhoto = "";
      
      modalTitle.textContent = 'Добавить локацию';
      document.getElementById('inpCityName').value = ''; document.getElementById('inpCityDesc').value = '';
      document.getElementById('inpNpcName').value = ''; document.getElementById('inpNpcDesc').value = '';
      
      state.selectedIcon = "🏰"; 
      cityPhotoPreview.style.display = 'none'; cityPhotoInput.value = '';
      npcPhotoPreview.style.display = 'none'; npcPhotoInput.value = '';
      
      renderIconPicker(iconPicker, EMOJI_ICONS, state.selectedIcon, (val) => { state.selectedIcon = val; state.tempCityPhoto = ""; cityPhotoPreview.style.display = 'none'; });
      renderEditNpcList(); 
      modal.classList.add('open');
    });

    editCityBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.currentCity) return;
      state.editingCityId = state.currentCity.id;
      state.tempNpcs = JSON.parse(JSON.stringify(state.currentCity.npcs || []));
      modalTitle.textContent = 'Изменить локацию';
      document.getElementById('inpCityName').value = state.currentCity.name;
      document.getElementById('inpCityDesc').value = state.currentCity.desc;
      
      state.selectedIcon = state.currentCity.icon || "🏰";
      if (state.currentCity.icon && state.currentCity.icon.startsWith('data:image')) {
        cityPhotoPreview.src = state.currentCity.icon; cityPhotoPreview.style.display = 'block'; 
        state.tempCityPhoto = state.currentCity.icon; cityPhotoInput.value = '';
      } else { cityPhotoPreview.style.display = 'none'; state.tempCityPhoto = ""; }
      
      renderIconPicker(iconPicker, EMOJI_ICONS, state.selectedIcon, (val) => { state.selectedIcon = val; state.tempCityPhoto = ""; cityPhotoPreview.style.display = 'none'; });
      renderEditNpcList(); 
      modal.classList.add('open');
    });

    function renderEditNpcList() {
      editNpcList.innerHTML = '';
      if (state.tempNpcs.length === 0) { editNpcList.style.display = 'none'; return; }
      editNpcList.style.display = 'block';
      editNpcList.innerHTML = '<label style="font-size:0.9rem; color:var(--accent); margin-bottom:0.4rem; display:block; font-family:var(--font-title);">Добавленные NPC:</label>';
      state.tempNpcs.forEach((npc, idx) => {
        const el = document.createElement('div'); el.className = 'edit-npc-item';
        let avatarStr = '👤';
        if (npc.avatar) avatarStr = npc.avatar.startsWith('data:image') ? '📷' : npc.avatar;
        el.innerHTML = `<span>${avatarStr} <b>${npc.name}</b></span><button style="background:none; border:none; color:var(--blood); cursor:pointer; font-size:1rem;" class="del-temp-npc" data-idx="${idx}">✕</button>`;
        el.querySelector('.del-temp-npc').addEventListener('click', () => { state.tempNpcs.splice(idx, 1); renderEditNpcList(); });
        editNpcList.appendChild(el);
      });
    }

    document.getElementById('addNpcBtn').addEventListener('click', () => {
      const name = document.getElementById('inpNpcName').value.trim();
      const desc = document.getElementById('inpNpcDesc').value.trim();
      if (!name) return alert('Введите имя NPC!');
      const avatar = state.tempNpcPhoto ? state.tempNpcPhoto : '👤';
      state.tempNpcs.push({ name, desc: desc || 'Нет описания.', avatar });
      document.getElementById('inpNpcName').value = ''; document.getElementById('inpNpcDesc').value = '';
      npcPhotoPreview.style.display = 'none'; npcPhotoInput.value = ''; state.tempNpcPhoto = "";
      renderEditNpcList();
    });

    document.getElementById('saveModal').addEventListener('click', () => {
      const name = document.getElementById('inpCityName').value.trim();
      const desc = document.getElementById('inpCityDesc').value.trim();
      if (!name) return alert('Введите название города!');

      const finalIcon = state.tempCityPhoto ? state.tempCityPhoto : state.selectedIcon;

      if (state.editingCityId) {
        const city = state.cities.find(c => c.id === state.editingCityId);
        if (city) { city.name = name; city.desc = desc; city.npcs = state.tempNpcs; city.icon = finalIcon; }
      } else {
        state.cities.push({ id: Date.now(), name, desc, x: state.tempCoord.x, y: state.tempCoord.y, icon: finalIcon, npcs: state.tempNpcs });
      }
      
      renderPins(); 
      modal.classList.remove('open'); 
      resetZoom(); 
      triggerSave();
    });

    document.getElementById('cancelModal').addEventListener('click', () => { modal.classList.remove('open'); });
    
    deleteCityBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.currentCity) return;
      if (confirm(`Вы уверены, что хотите предать огню город "${state.currentCity.name}"?`)) {
        state.cities = state.cities.filter(c => c.id !== state.currentCity.id);
        renderPins(); triggerSave(); resetZoom();
      }
    });

    modeBtn.addEventListener('click', () => {
      state.isMasterMode = !state.isMasterMode;
      modeBtn.classList.toggle('active', state.isMasterMode);
      modeBtn.innerHTML = `<span class="btn-icon">🛠️</span> Режим: ${state.isMasterMode ? 'Вкл' : 'Выкл'}`;
      viewport.classList.toggle('master-mode', state.isMasterMode);
      if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
    });

    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2.5 * 1024 * 1024) { alert("Файл слишком большой! Выберите картинку до 2.5 МБ."); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { 
        mapBg.src = ev.target.result; 
        mapBg.style.opacity = '1'; 
        saveBgBtn.style.display = 'flex'; 
        onMapLoaded(); 
      };
      reader.readAsDataURL(file);
      if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
    });

    saveBgBtn.addEventListener('click', () => {
      state.currentBgBase64 = mapBg.src;
      triggerSave();
      saveBgBtn.style.display = 'none';
      alert("Фоновая карта сохранена для этого мира!");
    });

    document.getElementById('openAllNpcBtn').addEventListener('click', () => {
      renderAllNpcs();
      allNpcModal.classList.add('open');
      if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
    });
    document.getElementById('closeAllNpcModal').addEventListener('click', () => allNpcModal.classList.remove('open'));

    document.getElementById('openAddGlobalNpcModal').addEventListener('click', () => {
      document.getElementById('inpGlobalNpcName').value = ''; document.getElementById('inpGlobalNpcDesc').value = '';
      globalNpcPhotoPreview.style.display = 'none'; globalNpcPhotoInput.value = ''; state.tempGlobalNpcPhoto = "";
      inpGlobalNpcCity.innerHTML = '';
      state.cities.forEach(city => {
        const opt = document.createElement('option'); opt.value = city.id; opt.textContent = city.name; inpGlobalNpcCity.appendChild(opt);
      });
      addGlobalNpcModal.classList.add('open');
    });
    document.getElementById('cancelAddGlobalNpc').addEventListener('click', () => addGlobalNpcModal.classList.remove('open'));

    document.getElementById('saveGlobalNpcBtn').addEventListener('click', () => {
      const name = document.getElementById('inpGlobalNpcName').value.trim();
      const desc = document.getElementById('inpGlobalNpcDesc').value.trim();
      const cityId = parseInt(inpGlobalNpcCity.value);
      if (!name) return alert('Введите имя NPC!');
      const city = state.cities.find(c => c.id === cityId);
      if (!city) return alert('Город не найден!');
      if (!city.npcs) city.npcs = [];
      const avatar = state.tempGlobalNpcPhoto ? state.tempGlobalNpcPhoto : '👤';
      city.npcs.push({ name, desc: desc || 'Нет описания.', avatar });
      triggerSave(); renderAllNpcs(); addGlobalNpcModal.classList.remove('open');
      if (state.currentCity && state.currentCity.id === cityId) openCityPanel(city);
    });

    function renderAllNpcs() {
      allNpcGrid.innerHTML = '';
      let totalNpcs = 0;
      state.cities.forEach(city => {
        if (city.npcs && city.npcs.length > 0) {
          city.npcs.forEach(npc => {
            totalNpcs++;
            const card = document.createElement('div'); card.className = 'big-npc-card';
            let avatarHtml = '👤'; let isImg = false;
            if (npc.avatar) { isImg = npc.avatar.startsWith('data:image'); avatarHtml = isImg ? `<img src="${npc.avatar}" alt="">` : npc.avatar; }
            card.innerHTML = `
              <div class="big-npc-avatar">${avatarHtml}</div>
              <div class="big-npc-info">
                <h3>${npc.name}</h3>
                <div class="location">📍 ${city.name}</div>
                <p>${npc.desc || 'Нет описания.'}</p>
                <button class="btn-go-to">Найти на карте</button>
              </div>
            `;
            card.addEventListener('click', (e) => {
              if (e.target.closest('.btn-go-to')) {
                e.stopPropagation(); allNpcModal.classList.remove('open'); state.highlightedNpcName = npc.name;
                openCityPanel(city, npc.name); zoomToCity(city);
              } else {
                openFullCard(npc.name, `Город: ${city.name}`, npc.desc, isImg ? npc.avatar : avatarHtml, isImg);
              }
            });
            allNpcGrid.appendChild(card);
          });
        }
      });
      if (totalNpcs === 0) allNpcGrid.innerHTML = '<p style="color:#5a6e7d; grid-column: 1/-1; text-align:center; padding: 2rem; font-style:italic;">В мире пока нет NPC.</p>';
    }

    document.getElementById('openItemsBtn').addEventListener('click', () => {
      renderItems(); allItemsModal.classList.add('open');
      if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
    });
    document.getElementById('closeAllItemsModal').addEventListener('click', () => allItemsModal.classList.remove('open'));

    document.getElementById('openAddItemModal').addEventListener('click', () => {
      document.getElementById('inpItemName').value = ''; document.getElementById('inpItemDesc').value = '';
      itemPhotoPreview.style.display = 'none'; itemPhotoInput.value = ''; state.tempItemPhoto = "";
      state.selectedItemIcon = "📦";
      renderIconPicker(itemIconPicker, ITEM_ICONS, state.selectedItemIcon, (val) => { state.selectedItemIcon = val; state.tempItemPhoto = ""; itemPhotoPreview.style.display = 'none'; });
      addItemModal.classList.add('open');
    });
    document.getElementById('cancelAddItem').addEventListener('click', () => addItemModal.classList.remove('open'));

    function renderItems() {
      allItemsGrid.innerHTML = '';
      if (state.items.length === 0) {
        allItemsGrid.innerHTML = '<p style="color:#5a6e7d; grid-column: 1/-1; text-align:center; padding: 2rem; font-style:italic;">Справочник пуст.</p>';
        return;
      }
      state.items.forEach((item, idx) => {
        const card = document.createElement('div'); card.className = 'big-npc-card';
        let avatarHtml = '📦'; let isImg = false;
        if (item.avatar) { isImg = item.avatar.startsWith('data:image'); avatarHtml = isImg ? `<img src="${item.avatar}" alt="">` : item.avatar; }
        card.innerHTML = `
          <div class="big-npc-avatar" style="border-color: var(--accent);">${avatarHtml}</div>
          <div class="big-npc-info">
            <h3 style="color: var(--accent);">${item.name}</h3>
            <p>${item.desc || 'Нет описания.'}</p>
            <button class="item-delete-btn" data-idx="${idx}">Удалить</button>
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (e.target.closest('.item-delete-btn')) return;
          openFullCard(item.name, 'Предмет', item.desc, isImg ? item.avatar : avatarHtml, isImg);
        });
        card.querySelector('.item-delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`Удалить предмет "${item.name}"?`)) {
            state.items.splice(idx, 1); triggerSave(); renderItems();
          }
        });
        allItemsGrid.appendChild(card);
      });
    }

    document.getElementById('addItemBtn').addEventListener('click', () => {
      const name = document.getElementById('inpItemName').value.trim();
      const desc = document.getElementById('inpItemDesc').value.trim();
      if (!name) return alert('Введите название предмета!');
      const avatar = state.tempItemPhoto ? state.tempItemPhoto : state.selectedItemIcon;
      state.items.push({ id: Date.now(), name, desc, avatar });
      triggerSave(); renderItems(); addItemModal.classList.remove('open');
    });

    document.getElementById('openSearchBtn').addEventListener('click', () => {
      searchModal.classList.add('open'); searchInput.value = ''; renderSearchResults('');
      if (window.innerWidth <= 768) desktopMenu.classList.remove('show');
    });
    document.getElementById('closeSearchModal').addEventListener('click', () => searchModal.classList.remove('open'));
    searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));

    function renderSearchResults(query) {
      searchResults.innerHTML = '';
      const q = query.toLowerCase().trim();
      if (!q) { searchResults.innerHTML = '<p style="color:#5a6e7d; text-align:center; font-style:italic;">Введите запрос...</p>'; return; }
      let found = false;
      state.cities.forEach(city => {
        if (city.name.toLowerCase().includes(q) || (city.desc && city.desc.toLowerCase().includes(q))) {
          found = true;
          const el = document.createElement('div'); el.className = 'search-item';
          el.innerHTML = `<span class="type">Локация</span><div class="title">${city.name}</div><div class="subtitle">${city.desc || ''}</div>`;
          el.addEventListener('click', () => { searchModal.classList.remove('open'); openCityPanel(city); zoomToCity(city); });
          searchResults.appendChild(el);
        }
        if (city.npcs) {
          city.npcs.forEach(npc => {
            if (npc.name.toLowerCase().includes(q) || (npc.desc && npc.desc.toLowerCase().includes(q))) {
              found = true;
              const el = document.createElement('div'); el.className = 'search-item';
              el.innerHTML = `<span class="type">NPC в г. ${city.name}</span><div class="title">${npc.name}</div><div class="subtitle">${npc.desc || ''}</div>`;
              el.addEventListener('click', () => { searchModal.classList.remove('open'); openCityPanel(city, npc.name); zoomToCity(city); });
              searchResults.appendChild(el);
            }
          });
        }
      });
      if (!found) searchResults.innerHTML = '<p style="color:#5a6e7d; text-align:center; font-style:italic;">Ничего не найдено.</p>';
    }
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (mapBg.src) onMapLoaded();
      }, 300);
    });
    initApp();

  </script>
</body>
</html>
